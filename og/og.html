<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:T;font-weight:900;src:url(../assets/fonts/tajawal-arabic-900-normal.woff2)}
@font-face{font-family:T;font-weight:500;src:url(../assets/fonts/tajawal-arabic-500-normal.woff2)}
@font-face{font-family:T;font-weight:700;src:url(../assets/fonts/tajawal-arabic-700-normal.woff2)}
@font-face{font-family:T;font-weight:700;src:url(../assets/fonts/tajawal-latin-700-normal.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:T;color:#eef1ff;position:relative;
 background:radial-gradient(700px 420px at 10% 0%,rgba(71,106,240,.35),transparent 70%),radial-gradient(600px 400px at 100% 100%,rgba(79,213,207,.2),transparent 70%),#0a0e27}
body::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(130,150,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(130,150,255,.14) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.copy{position:absolute;right:70px;top:70px;width:700px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:84px;height:84px;border-radius:22px;box-shadow:0 14px 40px rgba(71,140,240,.45)}
.brand b{font-weight:900;font-size:64px;line-height:1}
.brand small{display:block;font-weight:500;font-size:26px;color:#a6b0d4}
h1{font-weight:900;font-size:54px;line-height:1.25;margin-top:34px}
.g{background:linear-gradient(270deg,#4fd5cf,#6f84ff);-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;max-width:560px}
.chips span{font-weight:700;font-size:20px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(130,150,255,.3)}
.url{position:absolute;right:70px;bottom:44px;font-weight:700;font-size:24px;color:#4fd5cf;direction:ltr}
.shot{position:absolute;left:-40px;top:110px;width:600px;border-radius:20px;overflow:hidden;border:1px solid rgba(130,150,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px rgba(20,26,62,.8);transform:perspective(1400px) rotateY(12deg)}
.shot img{display:block;width:100%}
.ht{position:absolute;left:60px;bottom:40px;width:210px}
</style></head><body>
<div class="shot"><img src="../assets/img/cashier.webp"></div>
<div class="copy">
 <div class="brand"><img src="../assets/img/logo-icon.svg"><div><b>موازنة</b><small>المحاسبي</small></div></div>
 <h1>نظام كاشير ومحاسبة<br><span class="g">مصمم لمطعمك</span></h1>
 <div class="chips"><span>يعمل بدون إنترنت</span><span>فوترة «فاتورة» المرحلة الثانية</span><span>شراء لمرة واحدة</span></div>
</div>
<div class="url">mowaznah.com</div>
<img class="ht" src="../assets/img/hightech.png">
</body></html>
